schema_version = 1

[device]
name = "lmipro"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "lmipro SM8250: UEFI menu and XNU entry/VM/console reached; guarded original PMGR lifecycle passed and publication mode reached root-device discovery. RAM-root test integration is source work; complete OS boot is not established."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", ".github/**", ".gitignore", "local.toml.example"]
inputs = ["SoC support: UniXNU-sm8250-common at a6e7e36caab58f5b9a5625dbdb8da2bf290fa5cc (Kryo 585 topology, GICv3, 19.2 MHz timer, UFS/GPU/QUPv3 ranges, config fragment, two SMP patches).", "OS support: the ipados-17.7.11-21H461 profile (XNU 10063.141.1; iPad7,1 donor, build 21H461, j120ap).", "Board identity: Xiaomi Redmi K30 Pro / K30 Pro Zoom Edition, Qualcomm SM8250 (kona), 8x Kryo 585, Adreno 650, 6.67-inch 1080x2400 AMOLED, FocalTech FT3518 touch, QCA6390 Wi-Fi."]
configuration = ["board.toml: name lmipro, soc SM8250, soc_source sm8250, os_profile ipados-17.7.11-21H461, kit lmipro.", "Components: ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink, DarwinBoot. The device list repeats the ARM64 profile entries because a device array replaces the inherited array.", "kernel.config_fragments: arch:configs/common.config, soc:configs/sm8250.config, os:configs/ipados.config. patch_series: arch, soc, os and device layers in that order."]
procedure = ["python unixnu defconfig lmipro_defconfig -D ../UniXNU-lmipro", "python unixnu fetch -D ../UniXNU-lmipro", "python unixnu status --json -D ../UniXNU-lmipro"]
findings = ["The SM8250 and OS pins are retained. The complete inherited archive list is repeated before the board PMGR recipe because arrays replace inherited arrays.", "The existing SHENG_PMGR build option provides the compiler flag and archive input; a guarded device patch invokes the lmipro wrapper before calendar/AMFI initialization.", "Canonical RamBlock is appended to the complete component/archive lists with XNU_NATIVE_RAM_BLOCK=y; device reference/binding recipes qualify the actual original storage ABI."]
completion = ["unixnu status resolves the arch, SoC, OS and device layers without an error and reports the intended patch order and component sources.", "unixnu.lock pins every source and the porting-record checker accepts this file."]
limits = ["No hardware input has been read from the handset; the device tree still carries zero memory ranges.", "The sources have not been fetched in this environment, so unixnu.lock does not exist yet and status cannot run here."]
next_action = ["Run defconfig, fetch and status on a host with GitHub access, commit the generated unixnu.lock, then read the handset device tree to fill dts/lmipro.dts."]


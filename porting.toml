[[area]]
id = "packaging"
status = "planned"
components = ["XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "patches/**", "package/**", "scripts/**"]
inputs = [
  "Boot image format: Android boot header, 4096-byte pages; boot_a/boot_b size unread.",
  "Payload inputs: the kernel and its ADT, a trust cache bundle, a dense or packed Data seed, and the platform seed passed with --unique-chip-id.",
  "The firmware volume must carry UniXNURamDiskDxe, DiskIoDxe and FAT support for the initrd payload.",
]
configuration = [
  "board.toml [payload]: volume LMIPROESP, size_mib 192 (guide template value), loader firmware, kernel_args -v serial=3.",
  "board.toml [payload.adt]: unique_chip_id required, so no seed is stored in the repository.",
  "XnuPrelink and DarwinBoot are selected; the OS profile supplies the donor IPSW, prelink roots, early-security address and text fixups.",
]
procedure = [
  "python unixnu build payload -D ../UniXNU-lmipro --unique-chip-id <hex> --trust-cache <bundle> --data-ramdisk <seed>",
  "python unixnu bootimg -D ../UniXNU-lmipro --uefi ../uefi-lmipro --dtb <firmware.dtb>",
]
findings = ["The verified current UEFI is reused by hash. The next payload uses sheng-pmgr=1 and the official no-reset panic screen after linking the PMGR archive."]
completion = [
  "Kernel and prelink succeed, the payload contains every declared input, and the boot image matches the bootloader format and size limit.",
]
limits = [
  "The payload and boot image need the real DRAM size, the userdata geometry, a trust cache and a Data seed; the firmware volume needs Binaries/lmi.",
]
next_action = [
  "Record the boot partition size and the handset memory map, then build the payload and boot image.",
]
evidence = [
  { kind = "host", reference = "https://github.com/yang232138/UniXNU/actions/runs/40607908733", command = "macOS build: device_repository=yang232138/lmipro, device_ref=main, defconfig=lmipro_defconfig, steps=kernel", revision = "1823680bc66ed1844b3473d8cec227b6a8a5ca45", result = "kernel step succeeded; prelink reported kernel.macho sha256 7007ffec6383e02f63c4cdb07202371a92bcc125232aac80292389f30e7e0f3e" },
]


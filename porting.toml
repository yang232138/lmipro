[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "board.toml"]
inputs = ["DRAM base 0x80000000 (SM8250 platform) and the size of the first bank, read from /memory in the handset's live device tree.", "Reserved ranges from the historical lmi map in Platforms/Xiaomi/lmiPkg/Library/MemoryMapLib/MemoryMapLib.c: SMEM 0x80900000+0x200000, TZApps 0x80b00000+0x5500000, PIL 0x86000000+0xd200000, Display Reserved 0x9c000000+0x2400000, UEFI FD 0x9fc00000+0x300000."]
configuration = ["dts/lmipro.dts declares memory@80000000 with a zero size as the guide's REQUIRED placeholder, plus the four reserved regions above.", "The ADT handoff accepts one contiguous DRAM range, so a single enabled memory node is kept; the higher banks of this platform stay disabled until the handoff can describe them."]
procedure = ["Dump /proc/device-tree/memory and /proc/device-tree/reserved-memory on the handset (or from a UEFI dump) and fill the two reg values."]
findings = ["The memory node still has a zero size: the device tree compiles but the ADT describes no DRAM and the kernel would fail in arm_vm_init.", "The historical lmi map covers 0x80000000-0xa0000000 for the firmware and lists the four reserved regions now in the board DTS; it says nothing about the rest of the DRAM, so the bank size stays REQUIRED.", "The opaque original-provider storage uses the existing size-aware kernel object heap. No DRAM range, MMIO map or DMA window is added.", "PackedRAMDisk is loader-owned volatile memory with sparse nonzero-page backing; logical disk capacity does not reserve new physical memory ranges or introduce DMA."]
completion = ["The enabled memory range equals the handset's usable DRAM, every reserved region is excluded, and the kernel reaches arm_vm_init with a real DRAM size."]
limits = ["The DRAM bank size is unset, and the reserved regions are the vendor map rather than a measurement on this handset."]
next_action = ["Record /memory and /reserved-memory from the handset's live device tree, then confirm or correct the four reserved regions."]


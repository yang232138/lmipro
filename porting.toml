[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["board.toml", "proprietary-files.txt", "scripts/**", "package/**"]
inputs = ["Mu-Silicium lmi platform source: the public lmi UEFI work documents a Platforms/.../lmiPkg package, a BootShim with an ARM64 kernel header, a BootManager entry and the patched Qualcomm DXE modules from the handset XBL.", "Firmware binaries from this handset's own XBL and vendor partitions; the published overlay does not ship them."]
configuration = ["board.toml [firmware]: config lmi, DSC Platforms/Xiaomi/lmiPkg/lmi.dsc, FV Build/lmiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.", "board.toml [firmware.defines]: ENABLE_SECUREBOOT 0, DEVICE_MODEL 0, MEMORY_PROTECTION TRUE, SHIP_MODE FALSE, BUILDID_STRING lmipro-research."]
procedure = ["yang232138/uefi-lmipro is the board overlay: Platforms/Xiaomi/lmiPkg with the four UniXNU modules in lmi.dsc and lmi.fdf. Extract Binaries/lmi from the handset XBL, then run unixnu build firmware --uefi ../uefi-lmipro.", "Add the firmware log exporter (QR code) from the log-capture guide before the first boot."]
findings = ["The public lmi overlay carries Platforms/Xiaomi/lmiPkg with lmi.dsc, lmi.fdf, MemoryMapLib and ConfigurationMapLib; board.toml uses that package name and its paths.", "The overlay's MemoryMapLib places UEFI FD at 0x9fc00000 (3 MiB) and Display Reserved at 0x9c000000 (36 MiB). uefi-lmipro now exists as that overlay and wires UniXNURamDiskDxe, UniXNUDxe, UniXNU and DarwinBoot before BdsDxe, but no firmware can build until Binaries/lmi is extracted.", "The PMGR work is a source-kernel ABI integration; tests reuse the verified UEFI FD 720481eb15e6cb3a6552c717ee6e912649a9c81eef18c95ab00dff7627530ee6.", "RAM-root work reuses FD 720481eb15e6cb3a6552c717ee6e912649a9c81eef18c95ab00dff7627530ee6 and unchanged shim/firmware DTB; it does not modify DXE or vendor executables.", "Run41023291769 stopped in the host registration-name guard: a literal backslash-zero was compared instead of a NUL terminator. Corrected only the host comparator and replayed original registration0xfffffff00496f09c against candidate49334c98; no runtime driver, security or hardware inputs changed.", "Run41026312928 passed the complete 190-slot RamBlock ABI audit, then the static kernel link required definitions for all six weak optional native_ufs_store callbacks. The board RAM-only selection returns mode0 and failure for every persistent I/O; actual ARM64 code is checked. This does not implement or touch UFS and does not claim successful disk I/O."]
completion = ["The firmware volume builds, enters UniXNU, publishes the framebuffer and preserves the documented reserved ranges.", "The UniXNU menu and DarwinBoot handoff work on the handset with the firmware log exporter enabled."]
limits = ["No Binaries/lmi and no DSC build; the firmware volume has not been produced."]
next_action = ["Extract Binaries/lmi from the handset XBL (docs/firmware-inputs.md in uefi-lmipro), then build the firmware and record the FD size and load address."]


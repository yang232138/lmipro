schema_version = 1

[device]
name = "lmipro"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi K30 Pro / K30 Pro Zoom Edition (lmi / lmipro, SM8250). Structure and shared support are in place; no hardware input has been read from the handset and no image has been built."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", ".github/**", ".gitignore", "local.toml.example"]
inputs = [
  "SoC support: UniXNU-sm8250-common at a6e7e36caab58f5b9a5625dbdb8da2bf290fa5cc (Kryo 585 topology, GICv3, 19.2 MHz timer, UFS/GPU/QUPv3 ranges, config fragment, two SMP patches).",
  "OS support: the ipados-17.7.11-21H461 profile (XNU 10063.141.1; iPad7,1 donor, build 21H461, j120ap).",
  "Board identity: Xiaomi Redmi K30 Pro / K30 Pro Zoom Edition, Qualcomm SM8250 (kona), 8x Kryo 585, Adreno 650, 6.67-inch 1080x2400 AMOLED, FocalTech FT3518 touch, QCA6390 Wi-Fi.",
]
configuration = [
  "board.toml: name lmipro, soc SM8250, soc_source sm8250, os_profile ipados-17.7.11-21H461, kit lmipro.",
  "Components: ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink, DarwinBoot. The device list repeats the ARM64 profile entries because a device array replaces the inherited array.",
  "kernel.config_fragments: arch:configs/common.config, soc:configs/sm8250.config, os:configs/ipados.config. patch_series: arch, soc, os and device layers in that order.",
]
procedure = [
  "python unixnu defconfig lmipro_defconfig -D ../UniXNU-lmipro",
  "python unixnu fetch -D ../UniXNU-lmipro",
  "python unixnu status --json -D ../UniXNU-lmipro",
]
findings = ["The SM8250 and OS pins are retained. The complete inherited archive list is repeated before the board PMGR recipe because arrays replace inherited arrays.", "The existing SHENG_PMGR build option provides the compiler flag and archive input; a guarded device patch invokes the lmipro wrapper before calendar/AMFI initialization."]
completion = [
  "unixnu status resolves the arch, SoC, OS and device layers without an error and reports the intended patch order and component sources.",
  "unixnu.lock pins every source and the porting-record checker accepts this file.",
]
limits = [
  "No hardware input has been read from the handset; the device tree still carries zero memory ranges.",
  "The sources have not been fetched in this environment, so unixnu.lock does not exist yet and status cannot run here.",
]
next_action = [
  "Run defconfig, fetch and status on a host with GitHub access, commit the generated unixnu.lock, then read the handset device tree to fill dts/lmipro.dts.",
]
evidence = []

[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["board.toml", "proprietary-files.txt", "scripts/**", "package/**"]
inputs = [
  "Mu-Silicium lmi platform source: the public lmi UEFI work documents a Platforms/.../lmiPkg package, a BootShim with an ARM64 kernel header, a BootManager entry and the patched Qualcomm DXE modules from the handset XBL.",
  "Firmware binaries from this handset's own XBL and vendor partitions; the published overlay does not ship them.",
]
configuration = [
  "board.toml [firmware]: config lmi, DSC Platforms/Xiaomi/lmiPkg/lmi.dsc, FV Build/lmiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.",
  "board.toml [firmware.defines]: ENABLE_SECUREBOOT 0, DEVICE_MODEL 0, MEMORY_PROTECTION TRUE, SHIP_MODE FALSE, BUILDID_STRING lmipro-research.",
]
procedure = [
  "yang232138/uefi-lmipro is the board overlay: Platforms/Xiaomi/lmiPkg with the four UniXNU modules in lmi.dsc and lmi.fdf. Extract Binaries/lmi from the handset XBL, then run unixnu build firmware --uefi ../uefi-lmipro.",
  "Add the firmware log exporter (QR code) from the log-capture guide before the first boot.",
]
findings = ["The public lmi overlay carries Platforms/Xiaomi/lmiPkg with lmi.dsc, lmi.fdf, MemoryMapLib and ConfigurationMapLib; board.toml uses that package name and its paths.", "The overlay's MemoryMapLib places UEFI FD at 0x9fc00000 (3 MiB) and Display Reserved at 0x9c000000 (36 MiB). uefi-lmipro now exists as that overlay and wires UniXNURamDiskDxe, UniXNUDxe, UniXNU and DarwinBoot before BdsDxe, but no firmware can build until Binaries/lmi is extracted.", "The PMGR work is a source-kernel ABI integration; tests reuse the verified UEFI FD 720481eb15e6cb3a6552c717ee6e912649a9c81eef18c95ab00dff7627530ee6."]
completion = [
  "The firmware volume builds, enters UniXNU, publishes the framebuffer and preserves the documented reserved ranges.",
  "The UniXNU menu and DarwinBoot handoff work on the handset with the firmware log exporter enabled.",
]
limits = [
  "No Binaries/lmi and no DSC build; the firmware volume has not been produced.",
]
next_action = [
  "Extract Binaries/lmi from the handset XBL (docs/firmware-inputs.md in uefi-lmipro), then build the firmware and record the FD size and load address.",
]
evidence = []

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu"]
paths = ["dts/**", "configs/**"]
inputs = [
  "Kryo 585: cpu0-3 are Cortex-A55 (MPIDR Aff0 0x0-0x300) and cpu4-7 are Cortex-A77 (0x400-0x700), as declared in the shared sm8250.dtsi.",
  "GICv3 distributor at 0x17a00000 and redistributors at 0x17a60000 with a 0x20000 stride, exported to the ADT as intc; architectural timer at 19.2 MHz; PSCI 1.0 over SMC.",
]
configuration = [
  "dts/lmipro.dts sets unixnu,cluster-type = 'E' on cpu0-3 and 'P' on cpu4-7.",
  "ArmCpu and ArmDTPlatform are selected; the arch fragment enables CONFIG_XNU_ARMCPU, CONFIG_XNU_ARM_DT_PLATFORM, CONFIG_XNU_NATIVE_ARCH_TIMER and CONFIG_XNU_NATIVE_PAN.",
]
procedure = [
  "python unixnu build kernel -D ../UniXNU-lmipro, then build the payload and inspect the generated ADT for eight cpu nodes and their cluster-type values.",
]
findings = ["Without a cluster type the SoC topology patch maps a P core to cluster index one while MAX_CPU_CLUSTERS was one, and the parser writes past cluster_phys_to_logical on the stack.", "native-smp-secondary.patch is required because the reset vector otherwise masks MPIDR with 0xFF, which selects Aff0 = 0 for every kona core and hands every secondary the boot CPU's reset data.", "The guarded provider refuses unimplemented CPU power/idle methods; it does not qualify secondary-core, frequency or sleep operations."]
completion = [
  "All eight CPUs reach their entry checkpoint, the timer runs on each CPU, and IPIs reach the secondary cores.",
]
limits = [
  "Nothing has been compiled or run; the properties above are source facts from the SoC repository, not measurements.",
]
next_action = [
  "Build the kernel and check the ADT cpu nodes before any handset attempt.",
]
evidence = []

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "board.toml"]
inputs = [
  "DRAM base 0x80000000 (SM8250 platform) and the size of the first bank, read from /memory in the handset's live device tree.",
  "Reserved ranges from the historical lmi map in Platforms/Xiaomi/lmiPkg/Library/MemoryMapLib/MemoryMapLib.c: SMEM 0x80900000+0x200000, TZApps 0x80b00000+0x5500000, PIL 0x86000000+0xd200000, Display Reserved 0x9c000000+0x2400000, UEFI FD 0x9fc00000+0x300000.",
]
configuration = [
  "dts/lmipro.dts declares memory@80000000 with a zero size as the guide's REQUIRED placeholder, plus the four reserved regions above.",
  "The ADT handoff accepts one contiguous DRAM range, so a single enabled memory node is kept; the higher banks of this platform stay disabled until the handoff can describe them.",
]
procedure = [
  "Dump /proc/device-tree/memory and /proc/device-tree/reserved-memory on the handset (or from a UEFI dump) and fill the two reg values.",
]
findings = ["The memory node still has a zero size: the device tree compiles but the ADT describes no DRAM and the kernel would fail in arm_vm_init.", "The historical lmi map covers 0x80000000-0xa0000000 for the firmware and lists the four reserved regions now in the board DTS; it says nothing about the rest of the DRAM, so the bank size stays REQUIRED.", "The opaque original-provider storage uses the existing size-aware kernel object heap. No DRAM range, MMIO map or DMA window is added."]
completion = [
  "The enabled memory range equals the handset's usable DRAM, every reserved region is excluded, and the kernel reaches arm_vm_init with a real DRAM size.",
]
limits = [
  "The DRAM bank size is unset, and the reserved regions are the vendor map rather than a measurement on this handset.",
]
next_action = [
  "Record /memory and /reserved-memory from the handset's live device tree, then confirm or correct the four reserved regions.",
]
evidence = []

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["board.toml", "dts/**", "configs/**", "drivers/**", "scripts/**"]
inputs = [
  "UFS host controller at 0x1d84000 and PHY at 0x1d87000 from the shared dtsi; QUPv3 wrapper 0 at 0x9c0000 for the serial engines.",
  "The GPT of UFS LUN 0: the userdata entry (first and last LBA), the boot_a/boot_b size and the vendor partition that carries the firmware.",
  "The UFS stream identifiers this SoC routes (0x0e0 and 0x4e0) and the driver's admission keys.",
]
configuration = [
  "board.toml [userdata]: lba_bytes 4096, windows OS and Cryptex1,SystemOS; first_lba and last_lba stay zero until they are read from the handset.",
  "CONFIG_XNU_NATIVE_UFS is not set and no storage component is selected.",
]
procedure = [
  "sgdisk -p /dev/block/sda on the handset, record the userdata and boot entries, then select a storage component once its board inputs exist.",
]
findings = ["ShengUfs is the catalog storage component, but its board inputs in the catalog are sheng's (SM8550) and nothing about them has been verified on lmipro.", "Zero LBAs are deliberate: copying another phone's geometry would write the OS windows into the wrong range.", "The new recipe prepares the PMGR service boundary before AMFI. It adds no storage controls, LUN selection or userdata geometry; storage/root qualification remains pending."]
completion = [
  "SCSI capacity and GPT match the handset, the OS and SystemOS windows stay inside userdata, and the root volume mounts with launchd starting.",
]
limits = [
  "No partition geometry, no storage component, no root path.",
]
next_action = [
  "Read the GPT and record userdata and boot sizes before selecting a storage implementation.",
]
evidence = []


[[area]]
id = "power"
status = "implemented"
components = ["SoftwareAES"]
paths = ["package/*Power*", "package/PMGR-*", "scripts/*platform-power*", "patches/xnu/lmipro-platform-pmgr.patch", "docs/pmgr-abi.md"]
inputs = ["Pinned iPad7,1 iPadOS 17.7.11 / 21H461 AMFI/ApplePMGR contract; native IOPMGR ABI; freshly built candidate JSON and verified original kernelcache."]
configuration = ["CONFIG_XNU_SHENG_PMGR=y selects the guarded archive and pre-AMFI hook. Runtime default off; sheng-pmgr=1 is the unpublished lifecycle test."]
procedure = ["Build a flag-off reference; prepare the audited candidate, JSON and cache; restore config, compile/link the archive through the official driver; temporarily boot the mode-1 panic-screen image."]
findings = ["The current kernel reaches AMFI: No PMGR? at ConfigurationSettings.cpp:235 after passing the console-creation checkpoint.", "The catalog has no standalone PMGR component. The documented guarded original-provider/nub integration is adapted as board package code, retaining runtime identities and refusing unimplemented power operations."]
completion = ["Original-module audit, exact storage and all 340 provider slots pass; actual allocation, original methods and release counts reach the mode-1 PASS; genuine service publication is qualified separately."]
limits = ["No functional clock, regulator, CPU-power, sleep/resume or battery backend. Mode 1 publishes no service. Runtime qualification and full system boot remain pending."]
next_action = ["Build the ABI-gated kernel and observe the explicit unpublished lifecycle diagnostic before enabling mode 2."]


procedure = ["Build kernel with the pinned qualified reference and original cache; verify dispatch/imports; pack fresh seed with official DBRDISK1; add measured root-match UUID and test only with fastboot boot."]
findings = ["ShengUfs is the catalog storage component, but its board inputs in the catalog are sheng's (SM8550) and nothing about them has been verified on lmipro.", "Zero LBAs are deliberate: copying another phone's geometry would write the OS windows into the wrong range.", "The new recipe prepares the PMGR service boundary before AMFI. It adds no storage controls, LUN selection or userdata geometry; storage/root qualification remains pending.", "Photo1793314717812.jpg shows Failed to mount root device before any root media existed. Select unmodified RamBlock with exact static IOStorageFamily bindings and a fresh packed APFS seed; actual device I/O and mount are pending.", "Run41023291769 stopped in the host registration-name guard: a literal backslash-zero was compared instead of a NUL terminator. Corrected only the host comparator and replayed original registration0xfffffff00496f09c against candidate49334c98; no runtime driver, security or hardware inputs changed.", "Run41026312928 passed the complete 190-slot RamBlock ABI audit, then the static kernel link required definitions for all six weak optional native_ufs_store callbacks. The board RAM-only selection returns mode0 and failure for every persistent I/O; actual ARM64 code is checked. This does not implement or touch UFS and does not claim successful disk I/O."]
completion = ["SCSI capacity and GPT match the handset, the OS and SystemOS windows stay inside userdata, and the root volume mounts with launchd starting."]
limits = ["Source integration and static ABI validation do not prove actual media publication, I/O, APFS compatibility, root authentication or mount. The test seed has no userland."]
next_action = ["Verify host artifacts and actual FAT/ADT/seed identity, then photograph the next kernel result from a temporary handset boot."]


[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu"]
paths = ["dts/**", "configs/**"]
inputs = ["Kryo 585: cpu0-3 are Cortex-A55 (MPIDR Aff0 0x0-0x300) and cpu4-7 are Cortex-A77 (0x400-0x700), as declared in the shared sm8250.dtsi.", "GICv3 distributor at 0x17a00000 and redistributors at 0x17a60000 with a 0x20000 stride, exported to the ADT as intc; architectural timer at 19.2 MHz; PSCI 1.0 over SMC."]
configuration = ["dts/lmipro.dts sets unixnu,cluster-type = 'E' on cpu0-3 and 'P' on cpu4-7.", "ArmCpu and ArmDTPlatform are selected; the arch fragment enables CONFIG_XNU_ARMCPU, CONFIG_XNU_ARM_DT_PLATFORM, CONFIG_XNU_NATIVE_ARCH_TIMER and CONFIG_XNU_NATIVE_PAN."]
procedure = ["python unixnu build kernel -D ../UniXNU-lmipro, then build the payload and inspect the generated ADT for eight cpu nodes and their cluster-type values."]
findings = ["Without a cluster type the SoC topology patch maps a P core to cluster index one while MAX_CPU_CLUSTERS was one, and the parser writes past cluster_phys_to_logical on the stack.", "native-smp-secondary.patch is required because the reset vector otherwise masks MPIDR with 0xFF, which selects Aff0 = 0 for every kona core and hands every secondary the boot CPU's reset data.", "The guarded provider refuses unimplemented CPU power/idle methods; it does not qualify secondary-core, frequency or sleep operations.", "RamBlock has no new CPU/interrupt controller inputs. No secondary-core or CPU power behavior is qualified by the root-discovery panic."]
completion = ["All eight CPUs reach their entry checkpoint, the timer runs on each CPU, and IPIs reach the secondary cores."]
limits = ["Nothing has been compiled or run; the properties above are source facts from the SoC repository, not measurements."]
next_action = ["Build the kernel and check the ADT cpu nodes before any handset attempt."]


procedure = ["Run host geometry/census checks and porting-record validation; build fresh flag-off reference then actual archive, kernel, payload and boot image.", "Verify exact archive/source hashes and linked startup before temporary handset test."]
findings = ["Photo1794362862950.jpg: exact owner provisioning stage4/status0, SpringBoard27/backboardd58 generation1, no captured BRK, all6 display opens success, real1080/2400 replies, but zero validations/copies. All15 used selectors now visible; errors are not established as causal. Add opt-in bounded current-thread backboardd syscall-entry backtraces using pinned public backtrace_user, only after30s in a faultable non-interrupt/preemptible context and outside observation locks. This is call-chain sampling, not proof of a blocked thread or original software-renderer execution.", "Complete handset census proves no matched framebuffer service at the sample; board previously had no display archive.", "Board wrapper implements original family/IOSurface dependency checks, runtime original-class extent guard, real memory/provider/DT lifecycle, and preserves first failing stage and return status."]
completion = ["Real display service is published and accepts original user clients; qualify mapping before frame transfer.", "Actual userspace frames, correct colors, swaps and backlight are separately observed."]
limits = ["Original Legacy initStage=8/status=0, registration=1 and mapping observed on run 42771882999; dispatch observer qualified on handset; SpringBoard process present in photo 1794314831783.jpg, GUI not observed.", "Mode words read back successfully on handset and no BRK was captured in photo 1794351871644.jpg; CPU candidate run 42923624149 built and independently qualified; photo 1794357116801.jpg matches its CPU-specific output, but exact phone image hash was not read. PM=4/0, CPU enabled=1, owned=0, validate/transfers/copied/retired=0. No actual frame, ownership handoff, physical refresh or backlight operation qualified."]
next_action = ["Collect bounded original backboardd call chains, symbolicate against exact cache, identify actual render/wait path before changing display gates or optional error returns."]
evidence = [{ kind = "source", reference = "docs/observations/display-handoff-20261110.md", result = "Photo-qualified console geometry and corrected zero matched display counts; minimal startup wrapper implemented, handset initialization/mapping/publication observed in photo 1794298617391.jpg; UI observer shows 17/17 display calls; exact original FBSDisplayMode BRK identified, missing chosen mode words confirmed in current payload, precise offending argument not yet captured." }]


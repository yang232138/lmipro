schema_version = 2

[board]
name = "lmipro"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Redmi K30 Pro Zoom Edition (lmipro, SM8250)"
kit = "lmipro"

[components]
# The ARM64 profile already selects ArmDTPlatform, ArmCpu, SoftwareAES and
# XnuPrelink. A device list replaces that array, so every inherited entry is
# repeated here and DarwinBoot, which the firmware volume carries, is added.
# Storage, display, input, GPU and Wi-Fi components are selected only when their
# board inputs and evidence exist; see porting.toml.
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "lmipro_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/lmipro.dts"
include_dirs = ["soc:dts"]

[userdata]
# The android `userdata` GPT entry on UFS LUN 0. REQUIRED: both LBAs are read from
# the handset (`sgdisk -p` on the block device, or the partition step of the
# dual-system guide). Zero values keep the geometry unfinished on purpose: taking
# them from another phone would wipe the wrong range.
first_lba = 0x2C0000
last_lba = 0x3B4B7FA
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[firmware]
# Mu-Silicium board package: yang232138/uefi-lmipro carries the lmi overlay
# (Platforms/Xiaomi/lmiPkg) with the four UniXNU modules wired into its DSC/FDF.
# Its Binaries/lmi is the vendor DXE build input, so the "Binaries" submodule is
# not listed here: uefi-lmipro's workflow copies the overlay's Binaries/lmi into
# the Mu-Silicium tree instead of pulling Device-Binaries.
config = "lmi"
dsc = "Platforms/Xiaomi/lmiPkg/lmi.dsc"
fd = "Build/lmiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Mu_Basecore", "Silicium-ACPI",
              "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "0"
DEVICE_MODEL = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "lmipro-research"

[payload]
volume = "LMIPROESP"
# boot is 128 MiB on this handset (single slot; from fastboot getvar
# partition-size:boot = 0x8000000). 64 MiB matches the 64 MiB the firmware
# reserves at 0x93200000 for the ramdisk: 3 MiB firmware volume + device
# tree + FAT volume must fit if the image is flashed.
size_mib = 64
loader = "firmware"
title = "Redmi K30 Pro"
kernel_args = ["-v", "serial=3", "boot-progress=2"]
# Draw the first panic on the framebuffer: there is no serial console here,
# and without this a panic is indistinguishable from a hang.
panic_screen = true

[payload.adt]
# The platform seed is never stored in a repository: payload builds take it from
# --unique-chip-id or UNIXNU_UNIQUE_CHIP_ID.
# chip-id seeds the platform identity together with that seed; it matches the donor
# build's chip id from the OS profile.
chip_id = "0x8011"
unique_chip_id = "required"
